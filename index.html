<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Swordio2 - Action Platformer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="ui-container">
    <div class="stat">HP: <span id="hp" style="color:#ff4d4d;">100</span></div>
    <div class="stat">Coins: <span id="coins" style="color:#ffd700;">0</span></div>
    <div class="stat">Weapon: <span id="weapon" style="color:#00ffff;">Wooden Sword</span></div>
    <div class="stat">Keys: <span id="keys" style="color:#00ff00;">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div id="instructions">
    <b>Controls:</b> WASD or Arrow Keys = Move & Jump | <b>J</b> = Sword Attack | <b>E</b> = Open Chest / Interact
  </div>

  <script src="game.js"></script>
</body>
</html>
